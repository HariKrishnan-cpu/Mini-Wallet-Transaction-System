# Run with: --spring.profiles.active=mysql
# Create DB first:  CREATE DATABASE walletdb;
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/walletdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.h2.console.enabled=false
spring.sql.init.schema-locations=classpath:schema-mysql.sql
