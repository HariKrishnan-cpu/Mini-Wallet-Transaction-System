spring.application.name=mini-wallet

# ---- Default datasource: in-memory H2 (zero setup). Use the "mysql" profile for MySQL. ----
spring.datasource.url=jdbc:h2:mem:walletdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# ---- Schema is owned by schema.sql (explicit constraints), not generated by Hibernate ----
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Never leak internals in error responses ----
server.error.include-stacktrace=never
server.error.include-message=never
